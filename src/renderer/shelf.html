<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'">
  <title>Droper</title>
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="shelf.css">
</head>
<body>
  <div id="panel" class="panel">
    <header class="bar">
      <button id="menu" class="icon-btn" title="Menu" aria-label="Menu">⋯</button>
      <span class="grip" aria-hidden="true"></span>
      <button id="close" class="icon-btn" title="Hide shelf" aria-label="Hide shelf">✕</button>
    </header>
    <ul id="items" class="items" role="listbox" aria-multiselectable="true" tabindex="0"></ul>
    <div id="empty" class="empty">
      <div class="empty-icon" aria-hidden="true">⇩</div>
      <div>Drop files, text, links or images here</div>
    </div>
    <footer id="count" class="count"></footer>
  </div>
  <script type="module" src="shelf.js"></script>
</body>
</html>
